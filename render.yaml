# Render Blueprint — despliegue con un clic desde https://render.com
# (New → Blueprint → conectar el repo GitHub). La API key se configura
# manualmente como secreto en el panel del servicio (nunca en el repo).
services:
  - type: web
    name: tutor-sig
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODEL_PROVIDER
        value: openrouter
      - key: DEFAULT_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: FALLBACK_MODELS
        value: nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3.5-lightning:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - key: OPENROUTER_API_KEY
        sync: false # SECRETO: configúralo en el dashboard de Render
